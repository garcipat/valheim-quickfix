name: Release

# Builds one mod and attaches its Gale / Thunderstore zip to a GitHub release.
#
#  - Release: merge a release pull request from a branch release/<Mod>-vX.Y.Z (for example release/SignIcons-v0.1.0)
#    that renames the mod's CHANGELOG.md "Unreleased" section to [X.Y.Z]. The workflow tags the merge commit
#    <Mod>-vX.Y.Z, so the tagged commit already carries the closed changelog, and that section becomes the release
#    notes. The tag is the only place the version is written: it is built into the DLL and stamped into the zip's
#    manifest. The release-mod skill opens the pull request for you.
#  - By hand: push a tag <Mod>-vX.Y.Z on main. The "Unreleased" entries are renamed on the runner and become the release
#    notes; main gets the renamed section afterwards through a pull request (it needs "Allow GitHub Actions to create
#    pull requests" in the repo settings, else the branch is pushed and the pull request has to be opened by hand).
#  - Dry run: Actions > Release > Run workflow, pick the mod and a version. Builds the package from main's current
#    state and uploads it as a workflow artifact; no release, no tag, nothing is committed.
#
# Add every new mod to the options list and to the tag patterns below (scripts/package.sh checks this).

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to build
        type: choice
        required: true
        options:
          - ValheimQuickFix
          - SignIcons
          - ItemCompare
          - MoreSkills
          - MapRoutes
      version:
        description: Version for the dry run (no release is created)
        default: 0.0.0-dryrun
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'ValheimQuickFix-v*'
      - 'SignIcons-v*'
      - 'ItemCompare-v*'
      - 'MoreSkills-v*'
      - 'MapRoutes-v*'

permissions:
  contents: read

jobs:
  release:
    # Pull requests only count when merged from a release/<Mod>-vX.Y.Z branch of this repository.
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.merged &&
      startsWith(github.event.pull_request.head.ref, 'release/') && contains(github.event.pull_request.head.ref, '-v') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Only the release step and the changelog pull request need write access.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A merged release pull request is released from its merge commit on main.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Work out what to release
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          MOD_INPUT: ${{ inputs.mod }}
          VERSION_INPUT: ${{ inputs.version }}
        run: ./scripts/resolve-release.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Renames [Unreleased] to the version on this runner's copy and writes the entries as the release notes.
      # A dry run does the same, so it also proves there is something to release. After a release pull request the
      # section is already closed in the repo, and its text is used as the notes unchanged.
      - name: Close the changelog section
        env:
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./scripts/update-changelog.sh "$MOD" "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Build and package
        env:
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./scripts/package.sh --version "$VERSION" "$MOD"

      # A release pull request leaves the tag to this workflow. Tags pushed with the workflow's own token don't start
      # another run. A re-run finds the tag on the same commit and keeps it.
      - name: Tag the merge commit
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$MOD $VERSION" "$SHA"
          git push origin "$TAG"

      - name: Create the GitHub release
        if: steps.target.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
        run: |
          args=(--title "$MOD $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "dist/$MOD-$VERSION.zip" "${args[@]}"

      # Only for a tag pushed by hand: a release pull request already closed the section on main, so there is nothing
      # to change and this ends quietly. The tag stays on the commit that was released; main gets the renamed section
      # afterwards, through a pull request because main's ruleset declines direct pushes. Skipped, with a warning, when
      # main's Unreleased entries changed since the tag: they must not be released by accident.
      - name: Open a pull request with the changelog
        if: steps.target.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git fetch --depth=1 origin main
          git checkout --force -B main FETCH_HEAD
          if ! ./scripts/update-changelog.sh "$MOD" "$VERSION" --notes-file "$RUNNER_TEMP/release-notes-main.md"; then
            echo "::warning::Could not close the changelog on main; rename [Unreleased] to $VERSION in package/$MOD/CHANGELOG.md by hand."
            exit 0
          fi
          if ! cmp -s "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-notes-main.md"; then
            echo "::warning::package/$MOD/CHANGELOG.md on main changed since the tag; rename [Unreleased] to $VERSION there by hand."
            git checkout --force -- .
            exit 0
          fi
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="release/changelog-$MOD-$VERSION"
          git switch -c "$branch"
          git commit -m "Changelog: release $MOD $VERSION" "package/$MOD/CHANGELOG.md"
          if ! git push origin "$branch"; then
            echo "::warning::Could not push the changelog branch; rename [Unreleased] to $VERSION in package/$MOD/CHANGELOG.md by hand."
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Changelog: release $MOD $VERSION" \
            --body "Renames \`[Unreleased]\` to \`[$VERSION]\` in \`package/$MOD/CHANGELOG.md\`, as the Release workflow does for the release notes. Merge it before other changes touch the changelog." \
            || echo "::warning::Could not open the changelog pull request; branch $branch is pushed, open it by hand (the repo setting 'Allow GitHub Actions to create pull requests' must be on)."

      - name: Upload the package (dry run)
        if: steps.target.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.mod }}-${{ steps.target.outputs.version }}
          path: dist/*.zip
