name: Release

# Builds one mod and attaches its Gale / Thunderstore zip to a GitHub release.
#
#  - Release: push a tag <Mod>-vX.Y.Z (for example SignIcons-v0.1.0) on main. The tag is the only place the version
#    is written: it is built into the DLL and stamped into the zip's manifest, and the mod's CHANGELOG.md "Unreleased"
#    entries become the release notes and are renamed to that version (proposed to main as a pull request afterwards,
#    because main only takes pull requests; it needs "Allow GitHub Actions to create pull requests" in the repo settings).
#    The release-mod skill does this for you.
#  - Dry run: Actions > Release > Run workflow, pick the mod and a version. Builds the package from main's current
#    state and uploads it as a workflow artifact; no release, no tag, nothing is committed.
#
# Add every new mod to the options list and to the tag patterns below (scripts/package.sh checks this).

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to build
        type: choice
        required: true
        options:
          - ValheimQuickFix
          - SignIcons
          - ItemCompare
          - MoreSkills
      version:
        description: Version for the dry run (no release is created)
        default: 0.0.0-dryrun
  push:
    tags:
      - 'ValheimQuickFix-v*'
      - 'SignIcons-v*'
      - 'ItemCompare-v*'
      - 'MoreSkills-v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only the release step and the changelog pull request need write access.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what to release
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MOD_INPUT: ${{ inputs.mod }}
          VERSION_INPUT: ${{ inputs.version }}
        run: ./scripts/resolve-release.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Renames [Unreleased] to the version on this runner's copy and writes the entries as the release notes.
      # A dry run does the same, so it also proves there is something to release.
      - name: Close the changelog section
        env:
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./scripts/update-changelog.sh "$MOD" "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Build and package
        env:
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./scripts/package.sh --version "$VERSION" "$MOD"

      - name: Create the GitHub release
        if: steps.target.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
        run: |
          args=(--title "$MOD $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "dist/$MOD-$VERSION.zip" "${args[@]}"

      # The tag stays on the commit that was released; main gets the renamed section afterwards, through a pull request
      # because main's ruleset declines direct pushes. Skipped, with a warning, when main's Unreleased entries changed
      # since the tag: they must not be released by accident.
      - name: Open a pull request with the changelog
        if: steps.target.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD: ${{ steps.target.outputs.mod }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git fetch --depth=1 origin main
          git checkout --force -B main FETCH_HEAD
          if ! ./scripts/update-changelog.sh "$MOD" "$VERSION" --notes-file "$RUNNER_TEMP/release-notes-main.md"; then
            echo "::warning::Could not close the changelog on main; rename [Unreleased] to $VERSION in package/$MOD/CHANGELOG.md by hand."
            exit 0
          fi
          if ! cmp -s "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-notes-main.md"; then
            echo "::warning::package/$MOD/CHANGELOG.md on main changed since the tag; rename [Unreleased] to $VERSION there by hand."
            git checkout --force -- .
            exit 0
          fi
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="release/changelog-$MOD-$VERSION"
          git switch -c "$branch"
          git commit -m "Changelog: release $MOD $VERSION" "package/$MOD/CHANGELOG.md"
          if ! git push origin "$branch"; then
            echo "::warning::Could not push the changelog branch; rename [Unreleased] to $VERSION in package/$MOD/CHANGELOG.md by hand."
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Changelog: release $MOD $VERSION" \
            --body "Renames \`[Unreleased]\` to \`[$VERSION]\` in \`package/$MOD/CHANGELOG.md\`, as the Release workflow does for the release notes. Merge it before other changes touch the changelog." \
            || echo "::warning::Could not open the changelog pull request; branch $branch is pushed, open it by hand (the repo setting 'Allow GitHub Actions to create pull requests' must be on)."

      - name: Upload the package (dry run)
        if: steps.target.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.mod }}-${{ steps.target.outputs.version }}
          path: dist/*.zip
