name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Builds every mod and zips it exactly as it would be released.
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mod-packages
          path: dist/*.zip
